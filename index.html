<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My World ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffdde1,#ee9ca7);color:#fff;min-height:100vh}
.wrap{max-width:900px;margin:auto;padding:30px 18px}
.card{background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);border-radius:28px;padding:28px;margin:20px 0;box-shadow:0 12px 35px rgba(0,0,0,.15)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login .card{width:min(420px,100%);text-align:center}
.login input{width:100%;padding:14px;border:0;border-radius:14px;margin:12px 0;text-align:center;font-size:18px}
.btn{border:0;border-radius:14px;padding:13px 25px;background:#fff;color:#d94f70;font-weight:bold;cursor:pointer;font-size:16px}
#site{display:none}.hero{text-align:center;padding:35px 10px}.hero h1{font-size:48px;margin:10px}.hero p{font-size:20px}
.message{font-size:20px;line-height:2;text-align:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.gallery img{width:100%;height:240px;object-fit:cover;border-radius:18px;border:2px solid rgba(255,255,255,.5)}
.memory{text-align:center;font-size:19px;line-height:2}.logout{text-align:center}
</style>
</head>
<body>
<div id="login" class="login"><div class="card">
<h1>My World ❤️</h1><p>المكان ده ليكي إنتِ وبس 💕</p>
<input id="password" type="password" placeholder="اكتبي الباسورد">
<button class="btn" onclick="enter()">دخول ❤️</button>
<p id="error" style="display:none">الباسورد مش صحيح ❤️</p>
</div></div>

<div id="site" class="wrap">
<section class="hero"><h1>My World ❤️</h1><p>إنتِ أجمل حاجة في عالمي</p></section>

<section class="card">
<h2>رسالة حب ❤️</h2>
<div class="message">عايز اقولك انك اجمل بنوته عرفتها في حياتي بحب ي اجمل حاجه حصلتلي هتفضلي دايما بنتي وكل حاجه جميله في حياتي</div>
</section>

<section class="card">
<h2>صورنا ❤️📸</h2>
<div class="gallery">
<img src="IMG-20260611-WA0019.jpg" alt="صورتنا الأولى">
<img src="IMG-20260611-WA0020.jpg" alt="صورتنا الثانية">
<img src="IMG-20260611-WA0021.jpg" alt="صورتنا الثالثة">
<img src="IMG_20260728_185127.jpg" alt="صورتنا الرابعة">
</div>
</section>

<section class="card memory"><h2>ذكرياتنا 🌹</h2><p>كل لحظة معاكي ليها مكان خاص في قلبي ❤️</p></section>
<div class="logout"><button class="btn" onclick="logout()">خروج</button></div>
</div>

<script>
function enter(){
 if(document.getElementById('password').value==='282007'){
  sessionStorage.setItem('unlocked','1');show();
 }else document.getElementById('error').style.display='block'
}
function show(){document.getElementById('login').style.display='none';document.getElementById('site').style.display='block'}
function logout(){sessionStorage.removeItem('unlocked');location.reload()}
if(sessionStorage.getItem('unlocked')==='1')show();
</script>
</body>
</html>
